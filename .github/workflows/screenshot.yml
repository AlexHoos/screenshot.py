name: DLH722 Screenshot

on:
  schedule:
    - cron: "*/15 * * * *"   # alle 15 Minuten (UTC)
  workflow_dispatch:          # manueller Start per Button

permissions:
  contents: write

concurrency:
  group: screenshot
  cancel-in-progress: false

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright installieren
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Screenshot erstellen
        run: python screenshot.py

      - name: Screenshot ins Repository speichern
        run: |
          git config user.name "screenshot-bot"
          git config user.email "screenshot-bot@users.noreply.github.com"
          git add screenshots
          git commit -m "Screenshot $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git pull --rebase
          git push
